apiVersion: apps/v1
kind: Deployment
metadata:
  name: osint-scraper
  namespace: osint
  labels:
    app: osint-scraper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: osint-scraper
  template:
    metadata:
      labels:
        app: osint-scraper
    spec:
      containers:
        - name: osint-scraper
          image: osint-scraper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: osint-scraper-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10