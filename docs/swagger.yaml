paths:
  /admin/headers:
    get:
      description: Returns the full header configuration for all platforms
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/header.HeaderConfig'
      security:
      - ApiKeyAuth: []
      summary: List all platforms and their header sets
      tags:
      - Admin
  /admin/headers/{platform}:
    get:
      description: Returns the header configuration for a single platform
      parameters:
      - description: Platform name (e.g. instagram, snapchat, x, jaco)
        in: path
        name: platform
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/header.PlatformConfig'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get headers for a specific platform
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Appends a new header entry to the platform's header list
      parameters:
      - description: Platform name
        in: path
        name: platform
        required: true
        type: string
      - description: Header entry to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/header.HeaderEntry'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/header.HeaderEntry'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Add a new header set to a platform
      tags:
      - Admin
  /admin/headers/{platform}/{id}:
    delete:
      description: Removes a header entry by ID from a platform
      parameters:
      - description: Platform name
        in: path
        name: platform
        required: true
        type: string
      - description: Header set ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete a header set
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Replaces the headers for a specific header entry by ID
      parameters:
      - description: Platform name
        in: path
        name: platform
        required: true
        type: string
      - description: Header set ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated header entry
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/header.HeaderEntry'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/header.HeaderEntry'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update an existing header set
      tags:
      - Admin
  /admin/headers/{platform}/{id}/toggle:
    post:
      description: Enables or disables a specific header entry
      parameters:
      - description: Platform name
        in: path
        name: platform
        required: true
        type: string
      - description: Header set ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Toggle a header set enabled/disabled
      tags:
      - Admin
  /api/instagram/hashtags:
    get:
      description: Searches for Instagram hashtags based on a query string
      parameters:
      - description: Search query for hashtags
        in: query
