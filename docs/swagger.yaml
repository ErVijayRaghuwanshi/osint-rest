host: localhost:8080
info:
  contact: {}
  description: High-performance OSINT scraping microservice.
  title: OSINT Scraper API
  version: "1.0"
paths:
  /api/instagram/hashtags:
    get:
      description: Searches for Instagram hashtags based on a query string
      parameters:
      - description: Search query for hashtags
        in: query
        name: query
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search Instagram hashtags
      tags:
      - Instagram
  /api/instagram/ping:
    get:
      description: Pings instagram.com to ensure site is reachable
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check Instagram availability
      tags:
      - Instagram
  /api/instagram/timeline:
    get:
      description: Fetches timeline/posts for a given Instagram username
      parameters:
      - description: Instagram username
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Instagram user timeline
      tags:
      - Instagram
  /api/instagram/userinfo:
    get:
      description: Fetches detailed user information for a given Instagram username
      parameters:
      - description: 'Instagram username (default: sakshi_raghu_1c_)'
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/instagram.UserInfoResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Instagram user information
      tags:
      - Instagram
  /api/snapchat/ping:
    get:
      description: Pings snapchat.com to ensure site is reachable
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check Snapchat availability
      tags:
      - Snapchat
  /api/snapchat/userinfo:
    get:
      description: Fetches detailed user information for a given Snapchat username
      parameters:
      - description: 'Snapchat username (default: arora_girl)'
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/snapchat.UserInfoResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Snapchat user information
      tags:
      - Snapchat
  /api/x/ping:
    get:
      description: Pings x.com to ensure site is reachable
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check X availability
      tags:
      - X
  /api/x/userinfo:
    get:
      description: Fetches user information from X by screen name
      parameters:
      - description: X screen name
        in: query
        name: screen_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/x.UserInfo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get X user information
      tags:
      - X
  /health:
    get:
      description: Returns OK if service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check service health
      tags:
      - Health
swagger: "2.0"
